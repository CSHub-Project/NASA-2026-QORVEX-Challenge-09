services:
  fyrora:
    image: nginx:1.27-alpine
    container_name: fyrora-preview
    network_mode: host
    volumes:
      - /opt/fyrora/current:/usr/share/nginx/html:ro
      - /opt/fyrora/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
