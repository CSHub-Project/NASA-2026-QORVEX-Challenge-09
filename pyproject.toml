[project]
name = "nasa-2026-qorvex-challenge-09"
version = "0.1.0"
description = "QORVEX — NASA Space Apps Challenge 2026, Challenge 09"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "qorvex"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
