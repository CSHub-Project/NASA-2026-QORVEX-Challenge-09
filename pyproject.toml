[project]
name = "fyrora"
version = "0.1.0"
description = "Evidence-first MODIS and VIIRS hotspot harmonization for NASA Space Apps 2026"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "geopandas>=1.1,<2",
  "h5py>=3.15,<4",
  "h3>=4.3,<5",
  "httpx>=0.28,<1",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "polars>=1.35,<2",
  "pyhdf>=0.11.7,<0.12",
  "pyarrow>=21,<24",
  "pyproj>=3.7,<4",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "seaborn>=0.13,<1",
  "shapely>=2.1,<3",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

